<section class="section-stack">
  <div class="page-header">
    <div>
      <h1 class="page-title">Services</h1>
      <p class="page-subtitle">Services rattachés aux departements.</p>
    </div>
    <button class="btn btn--primary" (click)="openCreateForm()">Nouveau service</button>
  </div>

  <div class="card">
    <div class="form-grid">
      <label class="form-field">
        Recherche
        <input type="text" [(ngModel)]="searchTerm" placeholder="Code, nom, departement..." />
      </label>
      <label class="form-field">
        Taille page
        <select [(ngModel)]="pageSize">
          <option [ngValue]="5">5</option>
          <option [ngValue]="8">8</option>
          <option [ngValue]="15">15</option>
        </select>
      </label>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Nom</th>
          <th>Departement</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let srv of pagedServices" (click)="selectService(srv)">
          <td>{{ srv.code }}</td>
          <td>{{ srv.nom }}</td>
          <td>{{ srv.nomDepartement }}</td>
          <td>
            <div class="table-actions">
              <button class="icon-btn" title="Update" aria-label="Update" (click)="selectService(srv); $event.stopPropagation();">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
              </button>
              <button class="icon-btn icon-btn--danger" disabled title="Supprimer indisponible" aria-label="Supprimer indisponible">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18" />
                  <path d="M8 6V4h8v2" />
                  <path d="M19 6l-1 14H6L5 6" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="form-actions">
      <button class="btn btn--light" (click)="prevPage()">Precedent</button>
      <span class="chip">Page {{ pageIndex + 1 }} / {{ totalPages }}</span>
      <button class="btn btn--light" (click)="nextPage()">Suivant</button>
    </div>
  </div>

  <div class="crud-modal-overlay" *ngIf="showForm" (click)="closeFormModal()">
  <form class="card card--accent crud-modal" #serviceForm="ngForm" (click)="$event.stopPropagation()">
    <div class="page-header" style="margin-bottom: 1rem;">
      <div>
        <h2 class="page-title" style="font-size: 1.35rem;">Formulaire service</h2>
        <p class="page-subtitle">{{ message || 'Configurer le service et son rattachement.' }}</p>
      </div>
    </div>
    <div class="form-grid">
      <label class="form-field">
        Code
        <input type="text" [(ngModel)]="form.code" name="code" required placeholder="SRV-CRD" />
        <span class="badge badge--orange" *ngIf="submitted && serviceForm.controls['']?.invalid">Requis</span>
      </label>
      <label class="form-field">
        Nom
        <input type="text" [(ngModel)]="form.nom" name="nom" required placeholder="Credit" />
        <span class="badge badge--orange" *ngIf="submitted && serviceForm.controls['']?.invalid">Requis</span>
      </label>
      <label class="form-field">
        Departement
        <select [(ngModel)]="form.idDepartement" name="idDepartement" required>
          <option [ngValue]="undefined">Selectionner</option>
          <option *ngFor="let dep of departements" [value]="dep.id">{{ dep.nom }}</option>
        </select>
        <span class="badge badge--orange" *ngIf="submitted && serviceForm.controls['']?.invalid">Requis</span>
      </label>
    </div>
    <div class="form-actions">
      <button class="btn btn--primary" type="button" (click)="create(serviceForm)">Enregistrer</button>
      <button class="btn btn--light" type="button" (click)="closeFormModal()">Annuler</button>
    </div>
  </form>
  </div>
</section>
